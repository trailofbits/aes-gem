name: Rust

on:
  push:
    branches: [main]
    paths:
      - "ref/rust/**"
      - "kat.json"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "ref/rust/**"
      - "kat.json"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561  # master 2025-12-16
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        working-directory: ref/rust
        run: cargo fmt --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561  # master 2025-12-16
        with:
          toolchain: stable
          components: clippy
      - name: Run Clippy
        working-directory: ref/rust
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561  # master 2025-12-16
        with:
          toolchain: stable
      - name: Run tests
        working-directory: ref/rust
        run: cargo test --all-features

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561  # master 2025-12-16
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e67dedb5e3c590e1c9d9272ace46ef689da250d  # v2.67.27
        with:
          tool: cargo-mutants
      - name: Run mutation tests
        working-directory: ref/rust
        run: cargo mutants -vV --in-place
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: mutants-out
          path: ref/rust/mutants.out

[package]
name = "aes-gem"
version = "0.1.0"
description = """
Pure Rust implementation of AES-GEM (Galois Extended Mode)
Authenticated Encryption with Associated Data (AEAD) Cipher
with optional architecture-specific hardware acceleration
"""
authors = ["Trail of Bits", "RustCrypto Developers"]
edition = "2021"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["aead", "aes", "encryption", "nonce-extension"]
categories = ["cryptography", "no-std"]

[dependencies]
aead = { version = "=0.6.0-rc.10", default-features = false }
aes = { version = "=0.9.0-rc.4", optional = true }
cipher = "=0.5.0"
ctr = "=0.10.0-rc.3"
ghash = { version = "=0.6.0-rc.5", default-features = false }
inout = "0.2"
subtle = { version = "2", default-features = false }
zeroize = { version = "1", optional = true, default-features = false }

[dev-dependencies]
aead = { version = "=0.6.0-rc.10", features = ["dev"], default-features = false }
hex-literal = "0.4"

[features]
default   = ["aes", "alloc", "getrandom"]
std       = ["alloc"]
alloc     = []
getrandom = ["aead/getrandom", "rand_core"]
rand_core = ["aead/rand_core"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

